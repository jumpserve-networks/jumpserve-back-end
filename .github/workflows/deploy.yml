name: Deploy benchmark AMI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'experiments/**'
      - 'real_world/**'
      - '.github/workflows/real-world.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmark-ami-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: jumpserve-networks/jumpserve-infra/.github/workflows/benchmark-ami.yml@main
    with:
      backend_commit: ${{ github.sha }}
