defaults:
  timeout_seconds: 240

jobs:
  - name: delay-010ms-vs-011ms
    sudo: true
    script: netem_cubic_benchmark.py
    params:
      num_clients: 2
      client_names:
        - client1
        - client2
      client_delays_ms:
        - 10
        - 11
      client_ccas:
        - cubic
        - cubic
      client_file_sizes_mbytes:
        - 200
        - 200
      client_start_delays_ms:
        - 0
        - 0
      snapshot_metrics_source: ss
      ss_sample_interval_ms: 100
      ss_log_file: /home/bradley/jumpserve/sslogs/delay-10ms-vs-10-70ms-cubic-cubic-200MB-workload/run-delay-010ms-vs-011ms-ss.jsonl
      bottleneck_all_client_rate_mbit: 50
